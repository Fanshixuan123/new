<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在打开...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="guide" class="fixed inset-0 w-full h-full flex flex-col items-center justify-center" style="background: rgba(0,0,0,0.85); display: none;">
        <!-- 巨大白色箭头指向右上角 -->
        <div class="absolute top-16 right-8">
            <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 80 L80 20 M80 20 L40 20 M80 20 L80 60" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <!-- 引导文字 -->
        <div class="text-center px-8">
            <p class="text-red-500 text-3xl font-bold mb-6">① 请选择右上角 [...] 按钮</p>
            <p class="text-red-500 text-3xl font-bold">② 再点击「在浏览器中打开」</p>
        </div>
    </div>

    <script>
        (function() {
            var targetUrl = 'https://shenlongma.de5.net';
            var ua = navigator.userAgent.toLowerCase();
            var isWechat = /micromessenger/.test(ua);
            
            if (isWechat) {
                // 微信环境：显示引导内容 + 触发原生弹窗
                document.getElementById('guide').style.display = 'flex';
                // 立即触发跳转，微信会自动弹出原生提示框
                window.location.href = targetUrl;
            } else {
                // 非微信环境：直接跳转，不显示任何内容
                window.location.replace(targetUrl);
            }
        })();
    </script>
</body>
</html>
