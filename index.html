<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>访问引导</title>
    <!-- 引入Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 自定义Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff4d4f',
                    },
                }
            }
        }
    </script>
    
    <!-- 自定义样式和动画 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .pulse-dot {
                animation: pulseDot 1.5s ease-in-out infinite;
            }
            .breathe-arrow {
                animation: breatheArrow 2s ease-in-out infinite;
            }
        }
        
        @keyframes pulseDot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.15);
            }
        }
        
        @keyframes breatheArrow {
            0%, 100% {
                opacity: 1;
                transform: translateX(0);
            }
            50% {
                opacity: 0.7;
                transform: translateX(8px);
            }
        }
    </style>
</head>
<!-- 默认隐藏body，仅在微信环境下通过JS显示 -->
<body class="bg-gray-100 min-h-screen" style="display: none;">
    <!-- 主容器：全屏垂直居中 -->
    <div class="min-h-screen flex flex-col items-center justify-center px-4 py-8">
        <!-- 标题区域 -->
        <div class="text-center mb-8">
            <h1 class="text-[28px] font-bold text-gray-800 mb-2">请在浏览器中打开</h1>
            <p class="text-gray-500 text-lg">为保证正常访问，请按以下步骤操作</p>
        </div>
        
        <!-- 步骤卡片容器 -->
        <div class="w-full max-w-sm space-y-5">
            <!-- 步骤1：点击右上角三个点 -->
            <div class="bg-white rounded-2xl shadow-lg p-5 flex items-center space-x-4">
                <!-- 步骤数字 -->
                <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center flex-shrink-0">
                    <span class="text-white text-xl font-bold">1</span>
                </div>
                <!-- 步骤内容 -->
                <div class="flex-1">
                    <p class="text-lg font-semibold text-gray-800">点击右上角</p>
                    <p class="text-gray-500 mt-1">「三个点」图标</p>
                </div>
                <!-- 三个点图标（带动画） -->
                <div class="text-primary text-2xl pulse-dot">
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>
            
            <!-- 步骤2：选择在浏览器中打开 -->
            <div class="bg-white rounded-2xl shadow-lg p-5 flex items-center space-x-4">
                <!-- 步骤数字 -->
                <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center flex-shrink-0">
                    <span class="text-white text-xl font-bold">2</span>
                </div>
                <!-- 步骤内容 -->
                <div class="flex-1">
                    <p class="text-lg font-semibold text-gray-800">选择</p>
                    <p class="text-primary font-medium mt-1">「在浏览器中打开」</p>
                </div>
                <!-- 箭头图标（带动画） -->
                <div class="text-primary text-2xl breathe-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>
            
            <!-- 步骤3：自动跳转 -->
            <div class="bg-white rounded-2xl shadow-lg p-5 flex items-center space-x-4">
                <!-- 步骤数字 -->
                <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center flex-shrink-0">
                    <span class="text-white text-xl font-bold">3</span>
                </div>
                <!-- 步骤内容 -->
                <div class="flex-1">
                    <p class="text-lg font-semibold text-gray-800">浏览器打开后</p>
                    <p class="text-gray-500 mt-1">将自动跳转目标网站</p>
                </div>
                <!-- 浏览器图标 -->
                <div class="text-primary text-2xl">
                    <i class="fas fa-globe"></i>
                </div>
            </div>
        </div>
        
        <!-- 底部提示 -->
        <div class="mt-10 text-center">
            <div class="inline-flex items-center px-4 py-2 bg-primary/10 rounded-full">
                <i class="fas fa-info-circle text-primary mr-2"></i>
                <span class="text-primary font-medium">为保证正常访问，请使用系统浏览器打开</span>
            </div>
        </div>
        
        <!-- 安全提示 -->
        <div class="mt-6 text-center text-gray-400 text-sm">
            <p>安全加密通道 · 保护您的访问安全</p>
        </div>
    </div>
    
    <!-- 核心逻辑脚本 -->
    <script>
        // 目标跳转网址
        const TARGET_URL = 'https://shenlongma.de5.net';
        
        // 检测是否为微信内置浏览器
        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        
        if (!isWechat) {
            // 非微信环境（系统浏览器）：立即自动跳转
            window.location.href = TARGET_URL;
        } else {
            // 微信环境：显示引导内容
            document.body.style.display = 'block';
        }
    </script>
</body>
</html>
