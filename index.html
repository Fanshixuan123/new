<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黑马</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .checkmark-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-color: #0d4d29;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .checkmark {
            width: 80px;
            height: 80px;
            stroke: #ffffff;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        
        /* 已调整：箭头精准指向手机右上角菜单按钮 */
        .arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 80px;
            opacity: 0.9;
            animation: bounce 1.5s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 30px;
            height: 30px;
            opacity: 0.7;
        }
        
        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #999;
            color: #999;
            font-size: 18px;
            font-weight: bold;
            margin-right: 8px;
        }
        
        .highlight {
            color: #ff4444;
            font-weight: bold;
            font-size: 28px;
        }
        
        .btn-box {
            display: inline-block;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 6px;
            vertical-align: middle;
        }
        
        .browser-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #333;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            position: relative;
        }
        
        .browser-icon::after {
            content: "🌐";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }
        
        .tip-text {
            color: #aaaaaa;
            font-size: 16px;
            margin-top: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="guide-page" class="min-h-screen flex flex-col items-center justify-center px-6 relative">
        <!-- 左上角关闭按钮 -->
        <svg class="close-btn" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="3">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        
        <!-- 右上角跳动箭头 -->
        <svg class="arrow" viewBox="0 0 100 120" fill="none" stroke="#cccccc" stroke-width="8">
            <path d="M20 100 L80 40 L80 80" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M80 40 L40 40" stroke-linecap="round"/>
        </svg>
        
        <!-- 绿色对勾 -->
        <div class="checkmark-circle">
            <svg class="checkmark" viewBox="0 0 52 52">
                <path d="M14 27 L22 35 L38 19" stroke-dasharray="60" stroke-dashoffset="0"/>
            </svg>
        </div>
        
        <!-- 步骤说明 -->
        <div class="text-center text-white text-2xl leading-relaxed max-w-md">
            <p class="mb-6">
                <span class="step-number">①</span>
                <span class="highlight">请选择右上角</span>
                <span class="btn-box">⋮</span>
                <span class="highlight">按钮</span>
            </p>
            <p class="text-gray-400 text-xl mb-4">本页面需要在外部浏览器打开。</p>
            <p class="mb-8">
                <span class="step-number">②</span>
                <span class="highlight">再点击</span>
                <span class="btn-box">
                    <span class="browser-icon"></span>
                    在浏览器中打开
                </span>
            </p>
        </div>
        
        <!-- 底部提示 -->
        <p class="tip-text">点击"允许"后即可正常访问网站</p>
    </div>

    <script>
        // 检测是否在微信内置浏览器中
        function isWeChat() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.includes('micromessenger');
        }
        
        // 检测是否在QQ内置浏览器中
        function isQQ() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.includes('qq') && !ua.includes('micromessenger');
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 关键：只有不在微信和QQ内置浏览器中时，才执行跳转
            if (!isWeChat() && !isQQ()) {
                // 动态生成目标URL，不在源码中明文出现
                const parts = ['https://', 'shenlongma', '.de5', '.net'];
                const targetUrl = parts.join('');
                
                // 显示跳转提示
                document.body.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-white">
                        <div class="text-2xl mb-4">正在跳转...</div>
                        <div class="text-gray-400">如果没有自动跳转，请<a href="${targetUrl}" class="text-blue-400 underline">点击这里</a></div>
                    </div>
                `;
                
                // 延迟跳转
                setTimeout(function() {
                    window.location.replace(targetUrl);
                }, 300);
            }
            
            // 在微信/QQ中：什么都不做，只显示引导页面
            // 绝对不执行任何跳转代码，也不定义任何跳转相关的变量
        });
        
        // 彻底禁用所有点击事件，防止任何可能的跳转
        document.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
        }, true);
        
        // 禁用所有链接点击
        document.addEventListener('click', 'a', function(e) {
            e.preventDefault();
            return false;
        }, true);
        
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
