<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转提示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f5f5;font-family:Arial,"微软雅黑";}
.container{max-width:400px;margin:50px auto;padding:30px 20px;background:#fff;border-radius:12px;text-align:center;}
.title{font-size:18px;color:#333;margin-bottom:15px;}
.desc{font-size:14px;color:#666;line-height:1.6;margin-bottom:25px;}
</style>
</head>
<body>

<div class="container">
    <div class="title">请在浏览器打开继续</div>
    <div class="desc">
        点击右上角<br>
        选择【在浏览器打开】<br>
        即可正常访问
    </div>
</div>

<script>
// 目标网址（你的网址）
var targetUrl = "https://shenlongma.de5.net";

// 判断是否在微信/QQ内置浏览器
var ua = navigator.userAgent.toLowerCase();
var isWeChat = ua.indexOf('micromessenger') > -1;
var isQQ = ua.indexOf('qq') > -1 && ua.indexOf('mqqbrowser') == -1;

if (isWeChat || isQQ) {
    // 微信/QQ内：弹出提示
    alert("请点击右上角 → 在浏览器中打开，即可继续访问");
} else {
    // 外部浏览器：直接跳转你的网站
    window.location.href = targetUrl;
}
</script>

</body>
</html>
