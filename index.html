<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请在浏览器中打开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #guide {
            display: none;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            position: fixed;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        
        .arrow {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 120px;
            font-weight: bold;
            transform: rotate(45deg);
            line-height: 1;
        }
        
        .text {
            color: #ff0000;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div id="guide">
        <div class="arrow">↗</div>
        <div class="text">
            <div>① 请选择右上角 [...] 按钮</div>
            <div>② 再点击「在浏览器中打开」</div>
        </div>
    </div>

    <script>
        const TARGET = 'https://shenlongma.de5.net';
        const isWechat = /micromessenger/i.test(navigator.userAgent);

        if (isWechat) {
            document.getElementById('guide').style.display = 'flex';
        } else {
            window.location.replace(TARGET);
        }
    </script>
</body>
</html>
